name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: ccLynx
            archive: ccLynx-${{ github.ref_name }}-x86_64-linux.tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            binary: ccLynx
            archive: ccLynx-${{ github.ref_name }}-x86_64-linux-musl.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: ccLynx
            archive: ccLynx-${{ github.ref_name }}-aarch64-macos.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: ccLynx.exe
            archive: ccLynx-${{ github.ref_name }}-x86_64-windows.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux tar.gz
        if: contains(matrix.os, 'ubuntu')
        run: |
          tar -czf ${{ matrix.archive }} \
            -C target/${{ matrix.target }}/release ${{ matrix.binary }}

      - name: Package macOS tar.gz
        if: contains(matrix.os, 'macos')
        run: |
          tar -czf ${{ matrix.archive }} \
            -C target/${{ matrix.target }}/release ${{ matrix.binary }}

      - name: Package Windows zip
        if: contains(matrix.os, 'windows')
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  create-release:
    needs: build-release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f -name "*.tar.gz" -o -name "*.zip" | while read file; do
            cp "$file" release-files/
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true